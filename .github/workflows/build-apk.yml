name: Build Android APK

# 触发方式：
#   1) 自动：推送到 master/main 且改动了 main.py、buildozer.spec 等关键文件
#   2) 手动：仓库 Actions 页面 → Build Android APK → Run workflow
on:
  workflow_dispatch:
    inputs:
      archs:
        description: "覆盖 android.archs（留空则用 buildozer.spec 里的值，多架构用英文逗号分隔）"
        required: false
        default: ""
  push:
    branches: [master, main]
    paths:
      - "main.py"
      - "buildozer.spec"
      - "requirements.txt"
      - ".github/workflows/build-apk.yml"

# 同一分支只保留一次构建，新的推送会取消仍在跑的旧构建
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: buildozer android debug
    runs-on: ubuntu-latest
    # 首次构建要下载 SDK/NDK 并编译 CPython，留足时间（GitHub 硬上限 6 小时）
    timeout-minutes: 300

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # Ubuntu 24.04 自带的 Python 受 PEP 668 保护，且版本过新容易踩 buildozer 兼容问题，
      # 这里固定用 3.11 的工具链版本
      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统依赖（JDK 17 + 编译工具链）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev \
            libltdl-dev build-essential
          java -version

      - name: 安装 Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade cython buildozer
          buildozer --version

      - name: 打印并可选覆盖构建参数
        run: |
          if [ -n "${{ inputs.archs }}" ]; then
            sed -i "s|^android.archs = .*|android.archs = ${{ inputs.archs }}|" buildozer.spec
            echo "已把 android.archs 覆盖为：${{ inputs.archs }}"
          fi
          grep -E '^(title|package.name|version|requirements|android.api|android.archs) = ' buildozer.spec

      # ~/.buildozer 里是 Android SDK/NDK 与 p4a 编译缓存，~/.gradle 是 Gradle 缓存；
      # 命中缓存后增量构建可从 1 小时降到 10~20 分钟
      - name: 缓存 Buildozer / Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-${{ inputs.archs }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # p4a 的 unpack() 发现构建目录已存在就跳过解压，缓存里很可能残留着
      # 上一轮用「GitHub 源码归档」解压出来的 pygame 源码（没有预生成的 .c）。
      # 只改 recipe 的下载地址是不够的，必须把这两个目录删掉才会重新下载。
      - name: 清理缓存里残留的 pygame 源码
        run: |
          rm -rf ~/.buildozer/android/platform/build-*/build/other_builds/pygame
          rm -rf ~/.buildozer/android/platform/build-*/packages/pygame
          echo "已清理 pygame 构建/下载缓存"

      # p4a v2024.01.21 的 jpeg/png 等 recipe 用的是 cmake_minimum_required(VERSION 2.8) 旧写法，
      # runner 自带的 CMake 4.x 已彻底不兼容（/usr/bin/cmake 也是 4.x）。
      # 直接从 PyPI 装一个 CMake 3.x 并把它的 bin 前置到 PATH，让 p4a 用 3.x 构建。
      - name: 安装兼容 p4a 的 CMake 3.x
        run: |
          python -m pip install --upgrade "cmake<4"
          CMAKE_BIN="$(python -c 'import os, cmake; print(os.path.join(os.path.dirname(cmake.__file__), "data", "bin"))')"
          echo "pip cmake bin: $CMAKE_BIN"
          ls -l "$CMAKE_BIN" || true
          if [ -x "$CMAKE_BIN/cmake" ]; then
            echo "$CMAKE_BIN" >> "$GITHUB_PATH"
            "$CMAKE_BIN/cmake" --version | head -n 1
          else
            which -a cmake
            exit 1
          fi

      - name: 构建 debug APK
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          set -o pipefail
          cmake --version | head -n 1
          buildozer -v android debug 2>&1 | tee buildozer-build.log

      - name: 汇总产物信息
        id: apk
        run: |
          ls -lh bin/*.apk
          APK_PATH=$(ls bin/*.apk | head -n 1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename "$APK_PATH")" >> "$GITHUB_OUTPUT"
          {
            echo "### 构建成功"
            echo ""
            echo "- 产物：\`$(basename "$APK_PATH")\`"
            echo "- 大小：$(du -h "$APK_PATH" | cut -f1)"
            echo "- 提交：\`${{ github.sha }}\`"
            echo ""
            echo "在本次运行的 Artifacts 区域下载 APK。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      # 构建失败时，日志是唯一线索，所以无论成败都上传
      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: buildozer-build.log
          if-no-files-found: warn
          retention-days: 7
